# Formatting, lints, tests, docs, feature combinations, the minimum Rust
# version and the published package, on Linux and Windows. Started by hand
# (Actions > checks > Run workflow, or `gh workflow run checks --ref BRANCH`),
# which GitHub offers once this file is on the default branch. It never
# publishes anything.
name: checks

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libudev-dev pkg-config
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc -p cmh-sdk --all-features --no-deps --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain: [stable, "1.88"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libudev-dev pkg-config
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy && rustup default ${{ matrix.toolchain }}
      - run: cargo test --workspace --all-features --locked
      - name: feature combinations
        shell: bash
        run: |
          cargo test -p cmh-sdk --locked
          cargo test -p cmh-sdk --locked --features image
          cargo test -p cmh-sdk --locked --features test-support
      - if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libudev-dev pkg-config
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo package -p cmh-sdk --locked
      - run: cargo package -p cmh-sdk --list --locked
      - name: test the packaged crate outside the workspace
        run: |
          tar -xzf target/package/cmh-sdk-*.crate -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/cmh-sdk-*/
          cargo test --all-features --locked
          cargo build --examples --all-features --locked

  macos:
    # Compiles only: the SDK has never been run on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo check -p cmh-sdk --all-targets --all-features --locked
