[package]
name = "cmh-sdk"
description = "Independent cross-platform SDK for the Cooler Master MasterHUB modular control deck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["masterhub", "cooler-master", "hid", "macropad", "stream-deck"]
categories = ["hardware-support", "api-bindings"]
# Only this crate of the workspace is published; the workspace default stays
# `publish = false` for the command-line tool.

[package.metadata.docs.rs]
all-features = true

[features]
# Converts PNG / JPEG files and raw pixels into the JPEG flavour the display
# modules accept (`cmh_sdk::picture`).
image = ["dep:image"]

[[example]]
name = "show_picture"
required-features = ["image"]

[dependencies]
hidapi.workspace = true
image = { workspace = true, optional = true }
thiserror.workspace = true

# Already part of the build through hidapi; used directly to read the USB
# location of a module.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# Already part of the build through hidapi; used directly to watch /dev for
# hidraw nodes (inotify).
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
