[workspace]
resolver = "3"
members = ["crates/cmh-sdk", "crates/cmh-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
cmh-sdk = { path = "crates/cmh-sdk" }
hidapi = "2.6"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
] }
